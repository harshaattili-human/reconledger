name: Java verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile, run tests and package
        run: ./mvnw --batch-mode --no-transfer-progress verify
      - name: Exercise HTTP demo and persistent restart
        run: python3 scripts/smoke.py
