name: Java verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  java-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - run: python3 scripts/test_jar_audit.py
      - run: ./mvnw --batch-mode --no-transfer-progress -DskipTests package
      - name: Audit libraries in the executable JAR
        run: bash scripts/audit_jar.sh target/reconledger-0.1.0-SNAPSHOT-app.jar target/java-audit
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: java-audit
          path: target/java-audit/
          retention-days: 30
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Compile, run tests and package
        run: ./mvnw --batch-mode --no-transfer-progress verify
      - name: Show H2 query characterization
        run: cat target/query-characterization.json
      - name: Show H2 tenant browse characterization
        run: cat target/tenant-browse-characterization.json
      - name: Show statistics experiment applicability
        run: cat target/tenant-statistics.json
      - name: Exercise HTTP demo and persistent restart
        run: python3 scripts/smoke.py
      - name: Exercise secured JAR and pinned-key replacement
        run: python3 scripts/secured_smoke.py
      - name: Show secured H2 check receipt
        run: cat target/secured-smoke-h2.json
  verify-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: reconledger_test
          POSTGRES_USER: recon_test
          POSTGRES_PASSWORD: disposable-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U recon_test -d reconledger_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      RECON_TEST_DB_URL: jdbc:postgresql://127.0.0.1:5432/reconledger_test
      RECON_TEST_DB_USER: recon_test
      RECON_TEST_DB_PASSWORD: disposable-ci-password
      RECON_TEST_DB_VENDOR: PostgreSQL
      RECON_DB_URL: jdbc:postgresql://127.0.0.1:5432/reconledger_test
      RECON_DB_USER: recon_test
      RECON_DB_PASSWORD: disposable-ci-password
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Verify invariants on PostgreSQL
        run: ./mvnw --batch-mode --no-transfer-progress verify
      - name: Show PostgreSQL query characterization
        run: cat target/query-characterization.json
      - name: Show PostgreSQL tenant browse characterization
        run: cat target/tenant-browse-characterization.json
      - name: Show PostgreSQL tenant statistics experiment
        run: cat target/tenant-statistics.json
      - name: Exercise PostgreSQL profile and process restart
        run: python3 scripts/smoke.py --database postgres
      - name: Exercise secured PostgreSQL JAR and pinned-key replacement
        run: python3 scripts/secured_smoke.py --database postgres
      - name: Show secured PostgreSQL check receipt
        run: cat target/secured-smoke-postgres.json
  postgres-restore:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build executable JAR for restore rehearsal
        run: ./mvnw --batch-mode --no-transfer-progress -DskipTests package
      - name: Restore a logical backup into a fresh PostgreSQL cluster
        run: python3 scripts/restore_smoke.py
      - uses: actions/upload-artifact@v7
        with:
          name: postgres-restore-receipt
          path: target/postgres-restore.json
          if-no-files-found: error
          retention-days: 30
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: browser-tests/package-lock.json
      - name: Package the review interface with the API
        run: ./mvnw --batch-mode --no-transfer-progress -DskipTests package
      - run: npm ci
        working-directory: browser-tests
      - run: npx playwright install --with-deps chromium
        working-directory: browser-tests
      - name: Exercise review workflows against the executable JAR
        run: npm test
        working-directory: browser-tests
      - name: Exercise opt-in secured review workflows
        run: npx playwright test --config=playwright.secured.config.js
        working-directory: browser-tests
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: review-browser-report
          path: |
            browser-tests/playwright-report/
            browser-tests/playwright-report-secured/
          retention-days: 14
